# Local development only. PM2/Nginx remains the production deployment path.
services:
  co-study:
    build: .
    image: co-study:local
    container_name: co-study
    ports:
      - "3030:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: development
      VIDEO_PROVIDER: mesh
      ENABLE_DEV_MESH: "true"
    restart: unless-stopped
