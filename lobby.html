<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halastudy | اللوبي · The Lobby</title>
  <meta name="description" content="اللوبي — غرفة مذاكرة عامة مفتوحة. ادخل، شوف الناس تذاكر، وابدأ. The Halastudy Lobby: one public study room.">
  <link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F5F2EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/design-system/colors_and_type.css">
  <link rel="stylesheet" href="/design-system/landing.css">
  <script src="/js/halastudy-core.js"></script>
  <style>
    .lobby-wrap { max-inline-size: 1180px; margin-inline: auto; padding-block: 92px 40px; padding-inline: 16px; }

    /* Control bar: title + present count + density + pagination */
    .lobby-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
      margin-block-end: 18px;
    }
    .lobby-heading { display: flex; align-items: baseline; gap: 10px; margin-inline-end: auto; }
    .lobby-heading h1 { font-family: var(--font-display-ar); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.2; margin: 0; }
    html[lang="en"] .lobby-heading h1 { font-family: var(--font-display); }
    .lobby-count {
      font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em;
      color: var(--ink-2); white-space: nowrap;
    }
    .lobby-count .live-dot { display: inline-block; inline-size: 7px; block-size: 7px; border-radius: 50%; background: #35c26b; margin-inline-end: 6px; vertical-align: middle; }

    .density {
      display: inline-flex; align-items: center; gap: 2px;
      background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px;
    }
    .density-label { font-size: 12px; color: var(--ink-2); margin-inline: 8px 4px; white-space: nowrap; }
    .density button {
      border: 0; background: transparent; color: var(--ink-2);
      font: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
      min-inline-size: 34px; block-size: 30px; border-radius: 999px; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .density button[aria-pressed="true"] { background: var(--accent, var(--ink)); color: var(--card, #fff); font-weight: 600; }

    .pager { display: inline-flex; align-items: center; gap: 6px; }
    .pager button {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      inline-size: 34px; block-size: 34px; border-radius: 10px; cursor: pointer; font-size: 16px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager-status { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); min-inline-size: 66px; text-align: center; }

    /* The grid */
    .lobby-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
    .lobby-tile {
      position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
      background: #14110d; border: 1px solid rgba(255,255,255,.06);
      display: flex; align-items: center; justify-content: center;
    }
    .lobby-tile video { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; object-fit: cover; }
    .lobby-avatar {
      inline-size: clamp(38px, 22%, 64px); aspect-ratio: 1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 600; font-size: clamp(15px, 5cqi, 22px);
      color: #fff; text-transform: uppercase;
    }
    .lobby-tile-name {
      position: absolute; inset-block-end: 8px; inset-inline-start: 8px; inset-inline-end: 8px;
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-display-ar); font-size: 13px; color: #F3EBDE;
      text-shadow: 0 1px 5px rgba(0,0,0,.7); pointer-events: none;
    }
    html[lang="en"] .lobby-tile-name { font-family: var(--font-display); font-style: italic; }
    .lobby-tile-name .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lobby-tile-badge {
      position: absolute; inset-block-start: 8px; inset-inline-end: 8px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      background: rgba(0,0,0,.5); color: rgba(243,235,222,.85); padding: 3px 7px; border-radius: 999px;
      font-family: var(--font-mono);
    }
    .lobby-tile.is-live .lobby-tile-badge { background: rgba(53,194,107,.85); color: #05230f; }

    .lobby-empty { text-align: center; color: var(--ink-2); padding: 48px 16px; line-height: 1.8; }
    .lobby-grid.is-stale { opacity: .55; }

    /* Connection status: connecting, reconnecting, unreachable, full, failed */
    .lobby-status {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 16px; margin-block-end: 18px; color: var(--ink); font-size: 14px; line-height: 1.6;
    }
    .lobby-status[data-tone="error"] { border-color: var(--danger); }
    .lobby-status p { margin: 0; }
    .lobby-status-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .lobby-status-actions .btn { min-block-size: 44px; }
    .lobby-status[hidden], .lobby-status-actions [hidden] { display: none; }
    .camera-note { flex-basis: 100%; text-align: center; margin: 0; font-size: 13px; color: var(--ink-2); }
    .camera-note[data-tone="error"] { color: var(--danger); }
    .name-error { color: var(--danger); font-size: 13px; margin: 0 0 10px; }

    /* Footer action strip */
    .lobby-foot {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
      margin-block-start: 22px; color: var(--ink-2); font-size: 14px;
    }
    .lobby-foot .mic-note { display: inline-flex; align-items: center; gap: 6px; }

    /* Name gate */
    .name-gate { max-inline-size: 380px; margin: 40px auto; text-align: center; }
    .name-gate input {
      inline-size: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      background: var(--card); color: var(--ink); font: inherit; font-size: 15px; margin-block: 12px;
    }

    @media (max-width: 640px) {
      .lobby-heading { margin-inline-end: 0; inline-size: 100%; }
      .lobby-bar { gap: 10px; }
    }
  </style>
  <link rel="stylesheet" href="/design-system/public-shell.css">
  <script src="/js/public-shell.js" defer></script>
  <script src="/js/ui.js" defer></script>
</head>
<body class="is-landing-page" data-public-page="lobby">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Halastudy home">
      <span>Hala<em>study</em><span class="dot">.</span></span>
      <span class="divider" aria-hidden="true"></span>
      <span class="ar" aria-hidden="true">هلا</span>
    </a>
    <div class="topbar-right">
      <a class="topbar-link" id="auth-entry" href="/account.html" data-lang="signIn">تسجيل الدخول</a>
      <div class="lang-switch" role="tablist" aria-label="Language">
        <button type="button" data-lang-value="en">EN</button>
        <button type="button" data-lang-value="ar" class="is-on">ع</button>
      </div>
    </div>
  </header>

  <main class="lobby-wrap">
    <!-- Name gate (shown until a display name is set) -->
    <section class="name-gate" id="name-gate" hidden>
      <div class="eyebrow" data-lang="lobbyEyebrow">اللوبي</div>
      <h1 style="font-family:var(--font-display-ar);margin:6px 0 2px" data-lang="gateTitle">وش اسمك في الغرفة؟</h1>
      <p style="color:var(--ink-2)" data-lang="gateSub">اسم يشوفه غيرك. تقدر تتفرج بدون كاميرا.</p>
      <input type="text" id="name-input" maxlength="20" data-lang-placeholder="gatePlaceholder" placeholder="اسمك" aria-describedby="name-error">
      <p class="name-error" id="name-error" role="alert" hidden data-lang="gateEmpty">اكتب اسمك عشان تدخل.</p>
      <button class="btn btn-primary" id="name-go" style="inline-size:100%" data-lang="gateGo">ادخل اللوبي</button>
    </section>

    <!-- Lobby view -->
    <section id="lobby-view" hidden>
      <div class="lobby-bar">
        <div class="lobby-heading">
          <h1 data-lang="lobbyTitle">اللوبي</h1>
          <span class="lobby-count" id="present-count"><span class="live-dot"></span><span id="present-n">—</span> / 30</span>
        </div>

        <div class="density" role="group" aria-label="Grid density">
          <span class="density-label" data-lang="densityLabel">في الصفحة</span>
          <!-- buttons injected -->
        </div>

        <div class="pager">
          <button type="button" id="pg-prev" aria-label="Previous page">‹</button>
          <span class="pager-status" id="pg-status">1 / 1</span>
          <button type="button" id="pg-next" aria-label="Next page">›</button>
        </div>
      </div>

      <div class="lobby-status" id="lobby-status" role="status" hidden>
        <p id="lobby-status-text"></p>
        <div class="lobby-status-actions">
          <button type="button" class="btn btn-secondary btn--compact" id="lobby-retry" hidden></button>
          <a class="btn btn-secondary btn--compact" id="lobby-return" href="/" hidden></a>
        </div>
      </div>

      <div class="lobby-grid" id="grid" aria-live="polite"></div>
      <div class="lobby-empty" id="empty" hidden data-lang="empty">لسه ما فيه أحد. كن أول واحد يبدأ.</div>

      <div class="lobby-foot">
        <span class="mic-note"><span aria-hidden="true">🔇</span> <span data-lang="micOff">المايك مقفول للجميع</span></span>
        <button class="btn btn-secondary btn--compact" id="camera-cta">سجّل دخول عشان تفتح الكاميرا</button>
        <p class="camera-note" id="camera-note" role="status" hidden></p>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/video/realtimekit-client.js"></script>
  <script src="/js/video/video-client.js"></script>
  <script>
    const DICT = {
      en: {
        pageTitle: 'Halastudy | The Lobby',
        signIn: 'Sign in',
        lobbyEyebrow: 'The Lobby',
        lobbyTitle: 'The Lobby',
        gateTitle: 'What should we call you?',
        gateSub: 'A name others see. You can watch without a camera.',
        gatePlaceholder: 'Your name',
        gateGo: 'Enter the Lobby',
        gateEmpty: 'Type your name to enter.',
        densityLabel: 'Per page',
        empty: "Nobody here yet. Be the first to start.",
        micOff: 'Mic is off for everyone',
        camGuest: 'Sign in to turn on your camera',
        camReady: 'Turn on my camera',
        camOff: 'Turn off my camera',
        camBlocked: 'Camera access is blocked. Allow it in your browser settings, then try again.',
        camNoDevice: 'No camera found on this device. You can keep watching.',
        camBusy: 'Your camera is busy in another app. Close it, then try again.',
        camUnavailable: "Video isn't available right now. You're still in the Lobby.",
        camFull: 'All camera spots are taken right now. You can keep watching.',
        camFailed: "Couldn't start your camera. Try again.",
        watching: 'watching',
        live: 'live',
        full: 'The Lobby is full right now — try again in a bit, or open your own room.',
        statusConnecting: 'Connecting to the Lobby…',
        statusReconnecting: 'Connection lost. Reconnecting…',
        statusUnreachable: "Can't reach the Lobby. Check your connection and try again.",
        statusFailed: "Couldn't join the Lobby. Try again.",
        retry: 'Try again',
        retryNow: 'Reconnect now',
        backHome: 'Back to home',
        openOwn: 'Open your own room'
      },
      ar: {
        pageTitle: 'هلاستدي | اللوبي',
        signIn: 'تسجيل الدخول',
        lobbyEyebrow: 'اللوبي',
        lobbyTitle: 'اللوبي',
        gateTitle: 'وش اسمك في الغرفة؟',
        gateSub: 'اسم يشوفه غيرك. تقدر تتفرج بدون كاميرا.',
        gatePlaceholder: 'اسمك',
        gateGo: 'ادخل اللوبي',
        gateEmpty: 'اكتب اسمك عشان تدخل.',
        densityLabel: 'في الصفحة',
        empty: 'لسه ما فيه أحد. كن أول واحد يبدأ.',
        micOff: 'المايك مقفول للجميع',
        camGuest: 'سجّل دخول عشان تفتح الكاميرا',
        camReady: 'افتح كاميرتي',
        camOff: 'اقفل كاميرتي',
        camBlocked: 'الكاميرا مقفولة. اسمح لها من إعدادات المتصفح وجرّب مرة ثانية.',
        camNoDevice: 'ما لقينا كاميرا في جهازك. تقدر تكمل تتفرج.',
        camBusy: 'الكاميرا مستخدمة في تطبيق ثاني. سكّره وجرّب مرة ثانية.',
        camUnavailable: 'الفيديو مو متاح الحين. أنت لسه في اللوبي.',
        camFull: 'أماكن الكاميرا كلها مأخوذة الحين. تقدر تكمل تتفرج.',
        camFailed: 'ما قدرنا نشغّل كاميرتك. جرّب مرة ثانية.',
        watching: 'يتفرج',
        live: 'مباشر',
        full: 'اللوبي ممتلئ حالياً — جرّب بعد شوي، أو افتح غرفتك الخاصة.',
        statusConnecting: 'قاعدين نوصلك للوبي…',
        statusReconnecting: 'انقطع الاتصال. نحاول نرجعك…',
        statusUnreachable: 'ما قدرنا نوصل للوبي. تأكد من اتصالك وجرّب مرة ثانية.',
        statusFailed: 'ما قدرنا ندخلك اللوبي. جرّب مرة ثانية.',
        retry: 'جرّب مرة ثانية',
        retryNow: 'جرّب الاتصال الحين',
        backHome: 'ارجع للرئيسية',
        openOwn: 'افتح غرفتك الخاصة'
      }
    };
    window.HalaCore.initLang(DICT);
    const t = (k) => (DICT[document.documentElement.lang] || DICT.ar)[k] || k;

    // ---- Grid density presets: tiles-per-page -> desktop columns ----
    const DENSITY = [
      { n: 4, cols: 2 }, { n: 6, cols: 3 }, { n: 9, cols: 3 },
      { n: 12, cols: 4 }, { n: 16, cols: 4 }, { n: 20, cols: 5 }, { n: 30, cols: 6 }
    ];
    const NAME_KEY = 'halastudyDisplayName';
    const CLIENT_ID_KEY = 'halastudyClientId';
    const LOBBY_CAP = 30;
    const JOIN_TIMEOUT_MS = 10000;
    const SIGN_IN_URL = '/account.html?next=%2Flobby';
    // Seat-limit codes the video-token route returns (co-study-server.js).
    const CAMERA_FULL_CODES = ['ROOM_FULL', 'GLOBAL_VIDEO_LIMIT_REACHED', 'IP_VIDEO_LIMIT_REACHED'];

    const el = (id) => document.getElementById(id);
    const state = { participants: [], perPage: 12, page: 0, isMobile: window.innerWidth < 640, myName: '' };
    // RealtimeKit media layer (P4, option A). When connected, meeting participants
    // are the grid source; on any failure the lobby degrades to socket presence.
    const rtk = { meeting: null, connected: false, role: 'viewer', generation: 0 };
    let membershipToken = '';
    // Connection phase drives the status strip. Only 'connected' shows the
    // present count and the empty state, so a pending join never reads as
    // "nobody here".
    const conn = { phase: 'connecting', everJoined: false };
    const STATUS = {
      connecting: { text: 'statusConnecting', tone: 'info' },
      reconnecting: { text: 'statusReconnecting', tone: 'info', retry: 'retryNow' },
      unreachable: { text: 'statusUnreachable', tone: 'error', retry: 'retry', back: 'backHome' },
      full: { text: 'full', tone: 'error', retry: 'retry', back: 'openOwn' },
      failed: { text: 'statusFailed', tone: 'error', retry: 'retry', back: 'backHome' }
    };
    let retryJoin = null;
    // currentUser: undefined until the session check resolves, then a user or null.
    let currentUser;
    const cam = { busy: false, noteKey: '', tone: '' };
    const videoClient = window.HalastudyVideoClient
      ? window.HalastudyVideoClient.createVideoClient()
      : null;

    function clientId() {
      let id = null;
      try { id = localStorage.getItem(CLIENT_ID_KEY); } catch (_e) {}
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) || ('c-' + Math.random().toString(36).slice(2));
        try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (_e) {}
      }
      return id;
    }

    // ---- Density control ----
    function buildDensity() {
      const box = document.querySelector('.density');
      DENSITY.forEach((d) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = String(d.n);
        b.setAttribute('aria-pressed', String(d.n === state.perPage));
        b.addEventListener('click', () => { state.perPage = d.n; state.page = 0; syncDensity(); render(); });
        box.appendChild(b);
      });
    }
    function syncDensity() {
      document.querySelectorAll('.density button').forEach((b) => {
        b.setAttribute('aria-pressed', String(Number(b.textContent) === state.perPage));
      });
    }
    function effectiveCols() {
      const preset = DENSITY.find((d) => d.n === state.perPage) || DENSITY[3];
      return state.isMobile ? Math.min(2, preset.cols) : preset.cols;
    }

    // ---- Render ----
    function initial(name) { return (name || '؟').trim().charAt(0) || '؟'; }
    function colorFor(p) { return p.avatarColor || '#8a6d3b'; }

    // Grid source: RealtimeKit participants when connected, else socket presence.
    function getTiles() {
      if (rtk.connected && rtk.meeting) {
        try {
          const out = [];
          if (rtk.meeting.self) out.push(rtkTile(rtk.meeting.self, true));
          const joined = rtk.meeting.participants && rtk.meeting.participants.joined;
          const arr = joined && typeof joined.toArray === 'function' ? joined.toArray() : [];
          arr.forEach((p) => out.push(rtkTile(p, false)));
          return out;
        } catch (_e) { /* fall through to presence */ }
      }
      return state.participants;
    }
    function rtkTile(p, isSelf) {
      const on = !!p.videoEnabled;
      return {
        id: isSelf ? 'self' : (p.id || p.userId || p.customParticipantId),
        name: (isSelf ? state.myName : (p.name || p.displayName)) || '—',
        cameraOn: on,
        videoTrack: on ? (p.videoTrack || null) : null,
        avatarColor: null
      };
    }

    function render() {
      const joined = conn.phase === 'connected';
      const list = joined || conn.phase === 'reconnecting' ? getTiles() : [];
      el('present-n').textContent = joined ? String(list.length) : '—';
      const pages = Math.max(1, Math.ceil(list.length / state.perPage));
      if (state.page > pages - 1) state.page = pages - 1;
      if (state.page < 0) state.page = 0;

      el('pg-status').textContent = `${state.page + 1} / ${pages}`;
      el('pg-prev').disabled = state.page <= 0;
      el('pg-next').disabled = state.page >= pages - 1;

      const grid = el('grid');
      grid.classList.toggle('is-stale', conn.phase === 'reconnecting');
      grid.setAttribute('aria-busy', String(!joined));
      grid.style.gridTemplateColumns = `repeat(${effectiveCols()}, 1fr)`;

      const start = state.page * state.perPage;
      const slice = list.slice(start, start + state.perPage);
      el('empty').hidden = !joined || list.length !== 0;

      grid.replaceChildren(...slice.map((p) => tile(p)));
      syncCameraCta();
    }

    function setPhase(phase) {
      conn.phase = phase;
      if (phase === 'connected') conn.everJoined = true;
      renderStatus();
      render();
    }
    function renderStatus() {
      const box = el('lobby-status');
      const spec = STATUS[conn.phase];
      if (!spec) { box.hidden = true; return; }
      box.hidden = false;
      box.dataset.tone = spec.tone;
      el('lobby-status-text').textContent = t(spec.text);
      const retry = el('lobby-retry');
      retry.hidden = !spec.retry;
      if (spec.retry) retry.textContent = t(spec.retry);
      const back = el('lobby-return');
      back.hidden = !spec.back;
      if (spec.back) {
        back.textContent = t(spec.back);
        back.href = spec.back === 'openOwn' ? '/open' : '/';
      }
    }

    function tile(p) {
      const cell = document.createElement('div');
      cell.className = 'lobby-tile' + (p.cameraOn ? ' is-live' : '');
      cell.dataset.id = p.id;

      if (p.videoTrack) {
        // Live publisher: bind the RealtimeKit MediaStreamTrack. Muted — the
        // Lobby is silent (no remote audio), quiet by default.
        const v = document.createElement('video');
        v.autoplay = true; v.playsInline = true; v.muted = true;
        try { v.srcObject = new MediaStream([p.videoTrack]); } catch (_e) {}
        cell.appendChild(v);
      } else {
        const av = document.createElement('div');
        av.className = 'lobby-avatar';
        av.style.background = colorFor(p);
        av.textContent = initial(p.name);
        cell.appendChild(av);
      }

      const badge = document.createElement('div');
      badge.className = 'lobby-tile-badge';
      badge.textContent = p.cameraOn ? t('live') : t('watching');
      cell.appendChild(badge);

      const name = document.createElement('div');
      name.className = 'lobby-tile-name';
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = p.name || '—';
      name.appendChild(who);
      cell.appendChild(name);
      return cell;
    }

    // ---- Presence / socket ----
    let socket = null;
    function setParticipants(list) {
      state.participants = Array.isArray(list) ? list.slice() : [];
      // QA aid: ?demo=N appends N filler tiles so density/pagination are visible
      // without a live meeting. No effect unless the param is present.
      const demo = Number(new URLSearchParams(location.search).get('demo'));
      if (demo > 0) {
        const palette = ['#8a6d3b', '#6d7a8a', '#8a5a5a', '#5a8a6d', '#7a6d8a', '#8a7a5a'];
        for (let i = state.participants.length; i < Math.min(demo, LOBBY_CAP); i++) {
          state.participants.push({ id: 'demo-' + i, name: 'طالب ' + (i + 1), cameraOn: i % 4 === 0, avatarColor: palette[i % palette.length] });
        }
      }
      render();
    }

    function joinLobby(name) {
      membershipToken = '';
      void leaveRealtimeKit();
      setPhase('connecting');
      socket = io({ auth: { clientId: clientId() } });
      const activeSocket = socket;
      let joinTimer = null;
      // Bounded wait: an acknowledgement that never arrives becomes an
      // actionable error instead of an indefinite "connecting".
      const requestJoin = () => {
        clearTimeout(joinTimer);
        joinTimer = setTimeout(() => {
          if (socket === activeSocket && conn.phase !== 'connected') setPhase('failed');
        }, JOIN_TIMEOUT_MS);
        activeSocket.emit('join-room', { roomId: 'LOBBY', username: name, clientId: clientId() }, (res = {}) => {
          if (socket !== activeSocket) return;
          clearTimeout(joinTimer);
          if (!res.ok) {
            membershipToken = '';
            setPhase(res.errorCode === 'ROOM_FULL' ? 'full' : 'failed');
            return;
          }
          membershipToken = typeof res.membershipToken === 'string' ? res.membershipToken.trim() : '';
          setPhase('connected');
          setParticipants((res.room && res.room.participants) || []);
          // Now that we are a verified room member, connect to the SFU as a
          // watcher. Degrades silently to presence-only if video is unavailable.
          connectRealtimeKit('viewer');
        });
      };
      retryJoin = () => {
        if (socket !== activeSocket) return;
        if (activeSocket.connected) {
          setPhase('connecting');
          requestJoin();
          return;
        }
        // connect() is a no-op while Socket.IO waits between automatic
        // retries; closing first makes "Try again" connect immediately.
        activeSocket.disconnect();
        activeSocket.connect();
        setPhase('connecting');
      };
      activeSocket.on('connect', requestJoin);
      activeSocket.on('presence', (list) => setParticipants(list || []));
      activeSocket.on('connect_error', () => {
        if (socket !== activeSocket) return;
        clearTimeout(joinTimer);
        void leaveRealtimeKit();
        setPhase(conn.everJoined && activeSocket.active ? 'reconnecting' : 'unreachable');
      });
      activeSocket.on('disconnect', () => {
        if (socket !== activeSocket) return;
        clearTimeout(joinTimer);
        void leaveRealtimeKit();
        // socket.active is false after a server-side disconnect: Socket.IO will
        // not retry on its own, so offer the manual retry instead.
        setPhase(activeSocket.active ? 'reconnecting' : 'unreachable');
      });
      activeSocket.on('kicked', () => { void leaveRealtimeKit({ keepalive: true }); location.href = '/'; });
      activeSocket.on('room-closed', () => { void leaveRealtimeKit({ keepalive: true }); location.href = '/'; });
    }

    function leaveRealtimeKit(options = {}) {
      rtk.generation += 1;
      rtk.connected = false;
      rtk.meeting = null;
      membershipToken = '';
      return videoClient ? videoClient.leave(options) : Promise.resolve();
    }

    async function connectRealtimeKit(role) {
      if (!videoClient) return { ok: false };
      const generation = ++rtk.generation;
      rtk.connected = false;
      rtk.meeting = null;
      try {
        const payload = await videoClient.joinRealtimeKitRoom({
          roomId: 'LOBBY',
          displayName: state.myName,
          membershipToken,
          role,
          headless: true
        });
        if (generation !== rtk.generation) return { ok: false, errorCode: 'VIDEO_JOIN_SUPERSEDED' };
        if (!payload.meeting) {
          await videoClient.leave();
          return { ok: false, errorCode: 'VIDEO_PROVIDER_UNAVAILABLE' };
        }
        rtk.meeting = payload.meeting; rtk.connected = true;
        rtk.role = payload.role || role;
        wireRealtimeKitEvents(rtk.meeting);
        // Option A: let the SDK manage subscription in PAGINATED mode; density is
        // pure CSS layout. Page hint kept in sync in the pager handlers.
        try {
          const parts = rtk.meeting.participants;
          if (parts && typeof parts.setViewMode === 'function') await parts.setViewMode('PAGINATED');
        } catch (_e) {}
        render();
        return { ok: true };
      } catch (error) {
        if (generation === rtk.generation) {
          rtk.connected = false; rtk.meeting = null;
        }
        return error && error.payload
          ? error.payload
          : { ok: false, errorCode: error && error.code ? error.code : 'VIDEO_PROVIDER_UNAVAILABLE' };
      }
    }

    function wireRealtimeKitEvents(meeting) {
      const rerender = () => { if (rtk.connected && rtk.meeting === meeting) render(); };
      try {
        const p = meeting.participants;
        if (p && p.joined && typeof p.joined.on === 'function') {
          p.joined.on('participantJoined', rerender);
          p.joined.on('participantLeft', rerender);
          p.joined.on('videoUpdate', rerender);
        }
        if (p && typeof p.on === 'function') p.on('pageChanged', rerender);
        if (meeting.self && typeof meeting.self.on === 'function') meeting.self.on('videoUpdate', rerender);
      } catch (_e) {}
    }

    // ---- Auth-gated camera button ----
    function ownVideoOn() {
      const self = rtk.connected && rtk.meeting && rtk.meeting.self;
      return !!(self && rtk.role === 'publisher' && self.videoEnabled);
    }
    function syncCameraCta() {
      const cta = el('camera-cta');
      if (!currentUser) {
        cta.textContent = t('camGuest');
        cta.removeAttribute('aria-pressed');
        cta.disabled = false;
      } else {
        const on = ownVideoOn();
        cta.textContent = t(on ? 'camOff' : 'camReady');
        cta.setAttribute('aria-pressed', String(on));
        // Publishing needs a verified membership, so wait for the join.
        cta.disabled = cam.busy || conn.phase !== 'connected';
      }
      const note = el('camera-note');
      note.hidden = !cam.noteKey;
      note.textContent = cam.noteKey ? t(cam.noteKey) : '';
      if (cam.tone) note.dataset.tone = cam.tone; else delete note.dataset.tone;
    }
    function setCameraNote(key, tone = 'error') {
      cam.noteKey = key;
      cam.tone = key ? tone : '';
      syncCameraCta();
    }
    function refreshCameraCta(user) {
      currentUser = user || null;
      el('camera-cta').onclick = currentUser
        ? () => { void startPublishing(); }
        : () => { location.href = SIGN_IN_URL; };
      syncCameraCta();
    }
    function cameraErrorKey(error) {
      const name = error && error.name;
      if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') return 'camBlocked';
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') return 'camNoDevice';
      if (name === 'NotReadableError' || name === 'TrackStartError') return 'camBusy';
      return 'camFailed';
    }
    // Ask the browser for the camera before requesting a publisher token, so a
    // blocked or missing camera is reported truthfully and never takes a seat.
    // The probe track is stopped immediately; the provider opens its own.
    async function probeCamera() {
      const media = navigator.mediaDevices;
      if (!media || typeof media.getUserMedia !== 'function') return 'camNoDevice';
      try {
        const stream = await media.getUserMedia({ video: true, audio: false });
        stream.getTracks().forEach((track) => track.stop());
        return '';
      } catch (error) {
        return cameraErrorKey(error);
      }
    }
    async function enableOwnVideo(self) {
      if (typeof self.enableVideo !== 'function') throw new Error('enableVideo unavailable');
      await self.enableVideo();
      if (!self.videoEnabled) throw new Error('camera did not start');
    }
    async function startPublishing() {
      // Publish permission is baked into the token preset, so a viewer must
      // re-join with a publisher token before it can enable video. Toggling
      // afterward just enables/disables the track.
      if (cam.busy) return;
      cam.busy = true;
      setCameraNote('');
      try {
        const self = rtk.connected && rtk.role === 'publisher' && rtk.meeting && rtk.meeting.self;
        if (self && self.videoEnabled) {
          if (typeof self.disableVideo === 'function') await self.disableVideo();
        } else if (self) {
          await enableOwnVideo(self);
        } else {
          const blocked = await probeCamera();
          if (blocked) { setCameraNote(blocked); return; }
          const res = await connectRealtimeKit('publisher');
          if (res && res.ok && rtk.meeting && rtk.meeting.self) {
            await enableOwnVideo(rtk.meeting.self);
          } else if (res && res.errorCode === 'AUTH_REQUIRED') {
            location.href = SIGN_IN_URL;
            return;
          } else if (!res || res.errorCode !== 'VIDEO_JOIN_SUPERSEDED') {
            setCameraNote(res && CAMERA_FULL_CODES.includes(res.errorCode) ? 'camFull' : 'camUnavailable');
            // Re-attach as a watcher so the grid keeps showing the room.
            await connectRealtimeKit('viewer');
          }
        }
      } catch (error) {
        setCameraNote(cameraErrorKey(error));
      } finally {
        cam.busy = false;
        render();
      }
    }

    // ---- Boot ----
    function enterLobby(name) {
      state.myName = name;
      try { localStorage.setItem(NAME_KEY, name); } catch (_e) {}
      el('name-gate').hidden = true;
      el('lobby-view').hidden = false;
      buildDensity();
      joinLobby(name);
      if (window.HalaAuth) window.HalaAuth.getUser().then(refreshCameraCta).catch(() => refreshCameraCta(null));
      else refreshCameraCta(null);
    }

    (function boot() {
      state.perPage = state.isMobile ? 4 : 12;
      const syncRtkPage = () => {
        if (rtk.connected && rtk.meeting && rtk.meeting.participants && typeof rtk.meeting.participants.setPage === 'function') {
          try { rtk.meeting.participants.setPage(state.page + 1); } catch (_e) {}
        }
      };
      el('lobby-retry').addEventListener('click', () => { if (retryJoin) retryJoin(); });
      // initLang rewrites [data-lang] nodes; strings set from script follow here.
      document.querySelectorAll('[data-lang-value]').forEach((b) => {
        b.addEventListener('click', () => { renderStatus(); render(); });
      });
      el('pg-prev').addEventListener('click', () => { state.page--; render(); syncRtkPage(); });
      el('pg-next').addEventListener('click', () => { state.page++; render(); syncRtkPage(); });
      window.addEventListener('resize', () => {
        const m = window.innerWidth < 640;
        if (m !== state.isMobile) { state.isMobile = m; render(); }
      });
      window.addEventListener('pagehide', () => {
        void leaveRealtimeKit({ keepalive: true });
      });

      let saved = '';
      try { saved = localStorage.getItem(NAME_KEY) || ''; } catch (_e) {}
      if (saved) {
        enterLobby(saved);
      } else {
        const gate = el('name-gate');
        gate.hidden = false;
        const go = () => {
          const input = el('name-input');
          const v = input.value.trim();
          el('name-error').hidden = !!v;
          input.setAttribute('aria-invalid', String(!v));
          if (v) enterLobby(v); else input.focus();
        };
        el('name-go').addEventListener('click', go);
        el('name-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      }
    })();
  </script>
</body>
</html>
