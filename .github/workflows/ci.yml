name: CI

on:
  push:
  pull_request:

env:
  NODE_ENV: test

# Cancel superseded PR checks; preserve independent push, scheduled and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-resilience:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04, which Playwright 1.59 has no Chromium build for (2026-10-29)
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hardening
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: halastudy_hardening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hardening -d halastudy_hardening_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real database failure and recovery tests
        env:
          HALASTUDY_TEST_DATABASE_URL: postgresql://hardening:local-ci-only@127.0.0.1:5432/halastudy_hardening_test
        run: node --test tests/postgres/outages.test.js

  quality:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04, which Playwright 1.59 has no Chromium build for (2026-10-29)
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run warning-free code, migration, audit, unit, and integration gates
        run: npm run test:ci:quality

  infrastructure:
    runs-on: ubuntu-24.04 # see quality job note
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Pull pinned validation images
        run: |
          docker pull nginx:1.27.5-alpine
          docker pull node:22-alpine
          docker pull postgres:16.4-alpine3.20

      - name: Validate shell, migrations, Docker layers, and Nginx syntax
        run: npm run test:ci:infra

  browser-smoke:
    runs-on: ubuntu-24.04 # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 25

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile, webkit-desktop, webkit-mobile]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run ${{ matrix.project }} smoke tests
        run: npm run test:smoke -- --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            docs/implementation/2026-10-20-platform/evidence/browser-report/
            docs/implementation/2026-10-20-platform/evidence/browser-results/
          if-no-files-found: ignore
