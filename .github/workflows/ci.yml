name: CI

on:
  push:
  pull_request:

env:
  NODE_ENV: test

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run warning-free code, migration, audit, unit, and integration gates
        run: npm run test:ci:quality

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Pull pinned validation images
        run: |
          docker pull nginx:1.27.5-alpine
          docker pull node:22-alpine
          docker pull postgres:16.4-alpine3.20

      - name: Validate shell, migrations, Docker layers, and Nginx syntax
        run: npm run test:ci:infra

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile, webkit-desktop, webkit-mobile]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run ${{ matrix.project }} smoke tests
        run: npm run test:smoke -- --project=${{ matrix.project }}

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
