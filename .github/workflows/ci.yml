name: CI

on:
  push:
  pull_request:

jobs:
  postgres-resilience:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04, which Playwright 1.59 has no Chromium build for (2026-10-29)
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hardening
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: halastudy_hardening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hardening -d halastudy_hardening_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real database failure and recovery tests
        env:
          HALASTUDY_TEST_DATABASE_URL: postgresql://hardening:local-ci-only@127.0.0.1:5432/halastudy_hardening_test
        run: node --test tests/postgres/outages.test.js

  quality:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04, which Playwright 1.59 has no Chromium build for (2026-10-29)
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Syntax checks
        run: npm run check

      - name: Type checks
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dead-code scan
        run: npm run deadcode

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Integration tests
        run: npm run test:integration

      - name: Browser smoke tests
        run: npm run test:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            docs/implementation/2026-10-20-platform/evidence/browser-report/
            docs/implementation/2026-10-20-platform/evidence/browser-results/
          if-no-files-found: ignore
